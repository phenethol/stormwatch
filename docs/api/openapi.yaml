      x-requirements: [F-023, NF-05, PR-06]
      x-use-cases: [UC-016]
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Red moderacije, najstarija predaja prvo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDetailPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/moderation/reports/{report_id}/decision:
    post:
      tags: [Moderacija]
      operationId: decideReport
      summary: Potvrda ili odbijanje prijave
      description: |
        Odbijanje zahtijeva obrazloženje od najmanje 10 znakova (PR-09). Sustav ažurira reputaciju autora (PR-05)
        i šalje mu obavijest (UC-015).
      x-requirements: [F-011, F-021, F-023, NF-05, PR-05, PR-09]
      x-use-cases: [UC-016]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModerationDecision' }
      responses:
        '200':
          description: Odluka je spremljena.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Prijava više nije na čekanju (npr. obradio ju je drugi moderator).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/moderation/flags:
    get:
      tags: [Moderacija]
      operationId: listContentFlags
      summary: Prijavljeni sadržaj iz regija moderatora
      x-requirements: [F-015, F-023, NF-05]
      x-use-cases: [UC-016]
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - name: status
          in: query
          schema: { type: string, enum: [open, dismissed, removed], default: open }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Prijavljeni sadržaj, grupiran po stavci.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlagQueuePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/moderation/flags/{flag_id}/resolution:
    post:
      tags: [Moderacija]
      operationId: resolveContentFlag
      summary: Obrada prijavljenog sadržaja
      description: '`dismiss` odbacuje neosnovanu prijavu i sadržaj ostaje objavljen; `remove_content` briše sadržaj.'
      x-requirements: [F-023, NF-05]
      x-use-cases: [UC-016]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: flag_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlagResolution' }
      responses:
        '200':
          description: Stavka je obrađena.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlagQueueItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Stavku je već obradio drugi moderator.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/moderation/users/{username}/sanctions:
    post:
      tags: [Moderacija]
      operationId: sanctionUser
      summary: Upozorenje ili privremena zabrana objavljivanja
      description: |
        Sankcija se veže uz prijavu iz regije moderatora (`related_report_id`), čime se provjerava regija (NF-05).
        Zabrana traje P-09 i ukida se sama po isteku; korisnik dobiva obavijest.
      x-requirements: [F-024, NF-05, PR-09, P-09]
      x-use-cases: [UC-017]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SanctionCreate' }
      responses:
        '201':
          description: Sankcija je izrečena.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sanction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/moderation/users/{username}/trusted-observer:
    put:
      tags: [Moderacija]
      operationId: grantTrustedObserver
      summary: Dodjela uloge pouzdanog motritelja
      description: Moguća samo uz reputaciju ≥ P-08; nije automatska.
      x-requirements: [F-021, F-022, P-08]
      x-use-cases: [UC-018]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: Uloga je dodijeljena.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Reputacija korisnika je ispod praga P-08.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Moderacija]
      operationId: revokeTrustedObserver
      summary: Oduzimanje uloge pouzdanog motritelja
      x-requirements: [F-022]
      x-use-cases: [UC-018]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UsernamePath'
      responses:
        '200':
          description: Uloga je oduzeta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Stručni sadržaj
  /api/v1/events/{event_id}/expert-comment:
    put:
      tags: [Stručni sadržaj]
      operationId: upsertExpertComment
      summary: Objava ili izmjena stručnog komentara
      x-requirements: [F-025, NF-05]
      x-use-cases: [UC-019]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpertCommentUpsert' }
      responses:
        '200':
          description: Komentar je spremljen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpertComment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Stručni sadržaj]
      operationId: deleteExpertComment
      summary: Uklanjanje stručnog komentara
      x-requirements: [F-025]
      x-use-cases: [UC-019]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: Komentar je uklonjen.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/reports/{report_id}/valuable:
    put:
      tags: [Stručni sadržaj]
      operationId: markReportValuable
      summary: Označavanje prijave vrijednom za stručnu analizu
      x-requirements: [F-025]
      x-use-cases: [UC-019]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '204':
          description: Prijava je označena.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Stručni sadržaj]
      operationId: unmarkReportValuable
      summary: Uklanjanje oznake vrijedne prijave
      x-requirements: [F-025]
      x-use-cases: [UC-019]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '204':
          description: Oznaka je uklonjena.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Administracija
  /api/v1/admin/users:
    get:
      tags: [Administracija]
      operationId: searchUsers
      summary: Pretraživanje korisničkih računa
      x-requirements: [F-027]
      x-use-cases: [UC-020]
      parameters:
        - name: q
          in: query
          description: Dio korisničkog imena ili adrese e-pošte.
          schema: { type: string, maxLength: 100 }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: is_active
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Korisnici.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/users/{user_id}/roles:
    put:
      tags: [Administracija]
      operationId: setUserRoles
      summary: Dodjela i oduzimanje uloga moderatora i meteorologa
      description: Moderatoru se obavezno dodjeljuje barem jedna regija; promjena vrijedi od sljedećeg zahtjeva korisnika.
      x-requirements: [F-027, PR-06]
      x-use-cases: [UC-020]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolesUpdate' }
      responses:
        '200':
          description: Uloge su spremljene.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/users/{user_id}/deactivate:
    post:
      tags: [Administracija]
      operationId: deactivateUser
      summary: Deaktivacija korisničkog računa
      description: Korisnik se više ne može prijaviti, a sve njegove sesije prestaju vrijediti (F-030).
      x-requirements: [F-030]
      x-use-cases: [UC-020]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Račun je deaktiviran.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/admin/settings:
    get:
      tags: [Administracija]
      operationId: getSystemSettings
      summary: Parametri sustava i preuzimanja
      x-requirements: [F-028, NF-11]
      x-use-cases: [UC-021]
      responses:
        '200':
          description: Trenutačne vrijednosti parametara P-01 – P-10.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Administracija]
      operationId: updateSystemSettings
      summary: Podešavanje parametara
      description: |
        Šalju se samo promijenjena polja. Promjena vrijedi od sljedećeg ciklusa preuzimanja bez ponovnog
        pokretanja (F-028); interval kraći od 10 min se odbija (P-10).
      x-requirements: [F-028, NF-11, P-10]
      x-use-cases: [UC-021]
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SystemSettingsUpdate' }
      responses:
        '200':
          description: Parametri su spremljeni.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/fetch-runs:
    get:
      tags: [Administracija]
      operationId: listFetchRuns
      summary: Ishodi preuzimanja podataka DHMZ-a
      x-requirements: [F-026, F-029, NF-03]
      x-use-cases: [UC-022, UC-023]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: status
          in: query
          schema: { type: string, enum: [success, failed] }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Preuzimanja, najnovije prvo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FetchRunPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/usage-stats:
    get:
      tags: [Administracija]
      operationId: getUsageStatistics
      summary: Statistika korištenja sustava
      x-requirements: [F-029]
      x-use-cases: [UC-022]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Statistika za razdoblje.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageStatistics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: |
        Django sesija (HttpOnly, Secure, SameSite) koju izdaje django-allauth nakon prijave Google računom.
        To je vlastiti pristupni token sustava iz F-002; odjava i deaktivacija računa ga poništavaju.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: Vrijednost kolačića `csrftoken`; obavezna za POST, PUT, PATCH i DELETE.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    ReportId:
      name: report_id
      in: path
      required: true
      schema: { type: integer }
    CommentId:
      name: comment_id
      in: path
      required: true
      schema: { type: integer }
    EventId:
      name: event_id
      in: path
      required: true
      schema: { type: integer }
    StationId:
      name: station_id
      in: path
      required: true
      schema: { type: integer }
    LocationId:
      name: location_id
      in: path
      required: true
      schema: { type: integer }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: integer }
    UsernamePath:
      name: username
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Username' }
    RegionId:
      name: region_id
      in: query
      schema: { type: integer }
    PhenomenonFilter:
      name: phenomenon
      in: query
      description: Jedna ili više vrsta pojave (`?phenomenon=hail&phenomenon=snow`).
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/Phenomenon' }
    From:
      name: from
      in: query
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      schema: { type: string, format: date-time }
    ObservedFrom:
      name: observed_from
      in: query
      description: Početak razdoblja opažanja; frontend za „zadnja 24 h” šalje trenutak prije 24 h (F-006).
      schema: { type: string, format: date-time }
    ObservedTo:
      name: observed_to
      in: query
      schema: { type: string, format: date-time }
    Bbox:
      name: bbox
      in: query
      description: Vidljivi dio karte kao `min_lon,min_lat,max_lon,max_lat`.
      schema:
        type: string
        pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
        examples: ['13.2,42.3,19.5,46.6']
    UpdatedSince:
      name: updated_since
      in: query
      description: Vrijednost `server_time` iz prethodnog odgovora; vraćaju se samo promjene nakon tog trenutka (NF-02).
      schema: { type: string, format: date-time }

  responses:
    Unauthorized:
      description: Nema valjane sesije.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: Unauthorized }
    Forbidden:
      description: Nedovoljna ovlast, regija izvan nadležnosti moderatora ili aktivna zabrana (NF-05, PR-09).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: Prijava nije iz vaše regije., code: region_forbidden }
    NotFound:
      description: Resurs ne postoji ili ga pozivatelj ne smije vidjeti (PR-07).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { detail: Not Found }
    ValidationError:
      description: Neispravni podaci; greške su navedene po poljima.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example:
            detail:
              - type: value_error
                loc: [body, payload, observed_at]
                msg: Vrijeme opažanja ne smije biti ranije od 24 h prije predaje.

  schemas:
    # ---------- zajedničko
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
        code:
          type: string
          description: Strojno čitljiv razlog, npr. `posting_banned`, `region_forbidden`, `already_flagged`.
    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [type, loc, msg]
            properties:
              type: { type: string }
              loc:
                type: array
                items:
                  oneOf: [{ type: string }, { type: integer }]
              msg: { type: string }
    AllauthResponse:
      type: object
      description: Odgovor django-allauth headless; mjerodavna je njegova specifikacija.
      properties:
        status: { type: integer }
        data: { type: object, additionalProperties: true }
        meta:
          type: object
          properties:
            is_authenticated: { type: boolean }
          additionalProperties: true
      additionalProperties: true
    GeoPoint:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90, examples: [45.3083] }
        lon: { type: number, minimum: -180, maximum: 180, examples: [18.4078] }
    GeoJSONGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, enum: [Polygon, MultiPolygon] }
        coordinates: { type: array, items: {} }
    Username:
      type: string
      minLength: 3
      maxLength: 30
      pattern: '^[A-Za-z0-9_.-]+$'
      examples: [ana_motri]
    Source:
      type: string
      const: DHMZ
      description: Izvor podataka koji frontend mora prikazati (NF-08).
    RegionRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string, examples: [Slavonija] }

    # ---------- enumeracije
    Phenomenon:
      type: string
      enum: [hail, storm_wind, heavy_rain_flood, snow, glaze_ice, waterspout]
      description: |
        Vrsta pojave (PR-01): `hail` tuča, `storm_wind` olujni vjetar, `heavy_rain_flood` jaka kiša i poplava,
        `snow` snijeg, `glaze_ice` poledica, `waterspout` pijavica.
    Intensity:
      type: string
      enum: [pea, hazelnut, walnut, egg, weak, moderate, strong]
      description: |
        Za tuču veličina zrna (`pea` grašak, `hazelnut` lješnjak, `walnut` orah, `egg` jaje);
        za ostale pojave `weak` slab, `moderate` umjeren, `strong` jak (PR-01).
    Damage:
      type: string
      enum: [none, minor, significant, major]
      description: Procjena štete; bez štete, manja, znatna, velika (PR-01).
    ReportState:
      type: string
      enum: [submitted, pending, confirmed, rejected]
      description: predana, na čekanju, potvrđena, odbijena (F-011).
    VoteValue:
      type: string
      enum: [confirm, dispute]
      description: '`confirm` „I ja to vidim”, `dispute` „Kod mene nije tako”.'
    WarningLevel:
      type: string
      enum: [green, yellow, orange, red]
      description: Razina upozorenja prema ljestvici DHMZ-a (DR-02).
    Role:
      type: string
      enum: [trusted_observer, moderator, meteorologist, admin]

    # ---------- podaci DHMZ-a
    DataStatus:
      type: object
      required: [sources]
      properties:
        sources:
          type: array
          items:
            type: object
            required: [source, last_success_at, last_attempt_at, last_status]
            properties:
              source: { type: string, enum: [measurements, forecasts, warnings] }
              last_success_at: { type: [string, 'null'], format: date-time }
              last_attempt_at: { type: [string, 'null'], format: date-time }
              last_status: { type: [string, 'null'], enum: [success, failed, null] }
        next_fetch_at: { type: [string, 'null'], format: date-time }
    Region:
      type: object
      required: [id, name, max_active_warning_level]
      properties:
        id: { type: integer }
        name: { type: string }
        max_active_warning_level: { $ref: '#/components/schemas/WarningLevel' }
        geometry:
          description: Samo uz `include_geometry=true`.
          oneOf:
            - { $ref: '#/components/schemas/GeoJSONGeometry' }
            - { type: 'null' }
    Measurement:
      type: object
      required: [measured_at, source]
      properties:
        measured_at: { type: string, format: date-time }
        temperature_c: { type: [number, 'null'] }
        humidity_pct: { type: [number, 'null'], minimum: 0, maximum: 100 }
        pressure_hpa: { type: [number, 'null'] }
        wind_speed_ms: { type: [number, 'null'], minimum: 0 }
        wind_direction:
          type: [string, 'null']
          description: Strana svijeta kako je objavljuje DHMZ (DR-03), npr. `JZ`.
        source: { $ref: '#/components/schemas/Source' }
    MeasurementPage:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Measurement' }
        count: { type: integer }
    Station:
      type: object
      required: [id, name, location, region_id, latest_measurement]
      properties:
        id: { type: integer }
        name: { type: string, examples: [Osijek-Čepin] }
        location: { $ref: '#/components/schemas/GeoPoint' }
        altitude_m: { type: [integer, 'null'] }
        region_id: { type: integer }
        latest_measurement:
          oneOf:
            - { $ref: '#/components/schemas/Measurement' }
            - { type: 'null' }
    NearestMeasurement:
      type: object
      description: Mjerenje najbliže postaje prema PR-08; uz prijavu se pohranjuje i ne mijenja.
      required: [station_id, station_name, distance_km, measurement]
      properties:
        station_id: { type: integer }
        station_name: { type: string }
        distance_km: { type: number, minimum: 0 }
        measurement: { $ref: '#/components/schemas/Measurement' }
    ForecastPeriod:
      type: object
      required: [valid_from, valid_to]
      properties:
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        min_temp_c: { type: [number, 'null'] }
        max_temp_c: { type: [number, 'null'] }
        wind_direction: { type: [string, 'null'] }
        wind_speed_ms: { type: [number, 'null'] }
        precipitation_mm: { type: [number, 'null'] }
        symbol: { type: [string, 'null'], description: Oznaka vremenske prilike iz XML-a DHMZ-a. }
        description: { type: [string, 'null'] }
    Forecast:
      type: object
      required: [place_name, place_location, distance_km, issued_at, periods, source]
      properties:
        place_name: { type: string, description: Najbliže mjesto za koje DHMZ objavljuje prognozu (F-007). }
        place_location: { $ref: '#/components/schemas/GeoPoint' }
        distance_km: { type: number, minimum: 0 }
        issued_at: { type: string, format: date-time }
        periods:
          type: array
          items: { $ref: '#/components/schemas/ForecastPeriod' }
        source: { $ref: '#/components/schemas/Source' }
    Warning:
      type: object
      required: [id, region, level, title, valid_from, valid_to, issued_at, source]
      properties:
        id: { type: integer }
        region: { $ref: '#/components/schemas/RegionRef' }
        level: { $ref: '#/components/schemas/WarningLevel' }
        type: { type: [string, 'null'], description: 'Vrsta upozorenja iz CAP zapisa, npr. `grmljavinsko nevrijeme`.' }
        title: { type: string }
        description: { type: [string, 'null'] }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        issued_at: { type: string, format: date-time }
        source: { $ref: '#/components/schemas/Source' }
    PlaceWeather:
      type: object
      required: [location, region, nearest_measurement, forecast, active_warnings]
      properties:
        location: { $ref: '#/components/schemas/GeoPoint' }
        region:
          oneOf:
            - { $ref: '#/components/schemas/RegionRef' }
            - { type: 'null' }
        nearest_measurement:
          description: '`null` kad nema mjerenja unutar P-04.'
          oneOf:
            - { $ref: '#/components/schemas/NearestMeasurement' }
            - { type: 'null' }
        forecast:
          oneOf:
            - { $ref: '#/components/schemas/Forecast' }
            - { type: 'null' }
        active_warnings:
          type: array
          description: Prazan popis znači „Nema aktivnih upozorenja”.
          items: { $ref: '#/components/schemas/Warning' }
    Place:
      type: object
      required: [id, name, location]
      properties:
        id: { type: integer }
        name: { type: string, examples: [Đakovo] }
        location: { $ref: '#/components/schemas/GeoPoint' }
        region:
          oneOf:
            - { $ref: '#/components/schemas/RegionRef' }
            - { type: 'null' }

    # ---------- korisnici
    UserSummary:
      type: object
      description: Autor sadržaja. Za obrisani račun `username` je `null`, a frontend prikazuje „izbrisani korisnik”.
      required: [username, photo_url, is_trusted_observer, is_deleted]
      properties:
        username:
          oneOf:
            - { $ref: '#/components/schemas/Username' }
            - { type: 'null' }
        photo_url: { type: [string, 'null'], format: uri }
        is_trusted_observer: { type: boolean }
        is_meteorologist: { type: boolean, default: false }
        is_deleted: { type: boolean }
    PublicProfile:
      type: object
      required: [username, photo_url, bio, reputation, roles, report_count, date_joined]
      properties:
        username: { $ref: '#/components/schemas/Username' }
        photo_url: { type: [string, 'null'], format: uri }
        bio: { type: string, maxLength: 300 }
        reputation: { type: integer }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        report_count: { type: integer, minimum: 0 }
        date_joined: { type: string, format: date-time }
        is_followed_by_me: { type: boolean }
    MyProfile:
      allOf:
        - { $ref: '#/components/schemas/PublicProfile' }
        - type: object
          required: [email, moderator_regions, posting_banned_until, unread_notification_count]
          properties:
            email: { type: string, format: email }
            moderator_regions:
              type: array
              items: { $ref: '#/components/schemas/RegionRef' }
            posting_banned_until: { type: [string, 'null'], format: date-time }
            unread_notification_count: { type: integer, minimum: 0 }
    ProfileUpdate:
      type: object
      properties:
        bio: { type: string, maxLength: 300 }

    # ---------- prijave
    Photo:
      type: object
      required: [id, url, thumbnail_url]
      properties:
        id: { type: integer }
        url: { type: string, format: uri, description: Fotografija bez EXIF metapodataka (NF-07). }
        thumbnail_url: { type: string, format: uri }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
    ReportCreate:
      type: object
      description: |
        Pravila PR-01: intenzitet mora odgovarati vrsti pojave; vrijeme opažanja nije više od 5 min nakon predaje
        ni ranije od 24 h prije predaje. Fotografije prema P-03 i NF-06 (JPEG, PNG, WebP, HEIC).
      required: [phenomenon, intensity, damage, observed_at, lat, lon, photos]
      properties:
        phenomenon: { $ref: '#/components/schemas/Phenomenon' }
        intensity: { $ref: '#/components/schemas/Intensity' }
        damage: { $ref: '#/components/schemas/Damage' }
        observed_at: { type: string, format: date-time }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        location_source: { type: string, enum: [gps, map], default: gps }
        description: { type: string, maxLength: 2000 }
        photos:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, format: binary }
    ReportSummary:
      type: object
      description: Sažetak prijave za kartu i popise.
      required:
        - id
        - phenomenon
        - intensity
        - location
        - observed_at
        - state
        - author
        - confirmations
        - disputes
        - credibility
        - is_trusted_observer_report
        - is_valuable
        - event_id
        - thumbnail_url
        - comment_count
        - updated_at
      properties:
        id: { type: integer }
        phenomenon: { $ref: '#/components/schemas/Phenomenon' }
        intensity: { $ref: '#/components/schemas/Intensity' }
        location: { $ref: '#/components/schemas/GeoPoint' }
        observed_at: { type: string, format: date-time }
        state: { $ref: '#/components/schemas/ReportState' }
        author: { $ref: '#/components/schemas/UserSummary' }
        confirmations: { type: integer, minimum: 0 }
        disputes: { type: integer, minimum: 0 }
        credibility:
          type: number
          minimum: 0
          maximum: 100
          description: Ocjena vjerodostojnosti u postocima (PR-03).
        is_trusted_observer_report: { type: boolean, description: Posebna oznaka prijave pouzdanog motritelja (F-022). }
        is_valuable: { type: boolean, description: Meteorolog je označio prijavu kao vrijednu (F-025). }
        event_id: { type: [integer, 'null'] }
        thumbnail_url: { type: [string, 'null'], format: uri }
        comment_count: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
    ReportDetail:
      allOf:
        - { $ref: '#/components/schemas/ReportSummary' }
        - type: object
          required: [damage, description, photos, submitted_at, region, nearest_measurement, rejection_reason, my_vote, can_vote, event_title]
          properties:
            damage: { $ref: '#/components/schemas/Damage' }
            description: { type: [string, 'null'], maxLength: 2000 }
            photos:
              type: array
              items: { $ref: '#/components/schemas/Photo' }
            submitted_at: { type: string, format: date-time }
            region: { $ref: '#/components/schemas/RegionRef' }
            nearest_measurement:
              description: '`null` znači „Nema službenog mjerenja za vrijeme opažanja” (F-010).'
              oneOf:
                - { $ref: '#/components/schemas/NearestMeasurement' }
                - { type: 'null' }
            rejection_reason:
              type: [string, 'null']
              description: Vidljivo samo autoru, moderatoru regije i administratoru.
            my_vote:
              oneOf:
                - { $ref: '#/components/schemas/VoteValue' }
                - { type: 'null' }
            can_vote: { type: boolean, description: Smije li pozivatelj glasati (PR-02). }
            event_title: { type: [string, 'null'], examples: ['Tuča, Đakovo, 14. 7. 2026.'] }
    ReportPage:
      type: object
      required: [items, count, server_time]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportSummary' }
        count: { type: integer }
        server_time: { type: string, format: date-time }
        removed_ids:
          type: array
          description: Uz `updated_since`; prijave koje pozivatelj više ne smije vidjeti (odbijene ili obrisane).
          items: { type: integer }
    ReportDetailPage:
      type: object
      required: [items, count, server_time]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReportDetail' }
        count: { type: integer }
        server_time: { type: string, format: date-time }
    VoteRequest:
      type: object
      required: [value]
      properties:
        value: { $ref: '#/components/schemas/VoteValue' }
    VoteResult:
      type: object
      required: [report_id, confirmations, disputes, credibility, my_vote]
      properties:
        report_id: { type: integer }
        confirmations: { type: integer, minimum: 0 }
        disputes: { type: integer, minimum: 0 }
        credibility: { type: number, minimum: 0, maximum: 100 }
        my_vote:
          oneOf:
            - { $ref: '#/components/schemas/VoteValue' }
            - { type: 'null' }
    Comment:
      type: object
      required: [id, report_id, author, text, created_at]
      properties:
        id: { type: integer }
        report_id: { type: integer }
        author: { $ref: '#/components/schemas/UserSummary' }
        text: { type: string, maxLength: 1000 }
        created_at: { type: string, format: date-time }
    CommentCreate:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
    CommentPage:
      type: object
      required: [items, count, server_time]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
        count: { type: integer }
        server_time: { type: string, format: date-time }
        removed_ids:
          type: array
          items: { type: integer }
    FlagCreate:
      type: object
      required: [reason]
      properties:
        reason: { type: string, enum: [false_information, inappropriate, spam, other] }
        note: { type: string, maxLength: 500 }
    ContentFlag:
      type: object
      required: [id, target_type, target_id, reason, created_at]
      properties:
        id: { type: integer }
        target_type: { type: string, enum: [report, comment] }
        target_id: { type: integer }
        reason: { type: string, enum: [false_information, inappropriate, spam, other] }
        note: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    # ---------- događaji i statistika
    EventSummary:
      type: object
      required: [id, title, phenomenon, region, started_at, last_report_at, report_count, centroid, has_expert_comment]
      properties:
        id: { type: integer }
        title: { type: string, examples: ['Tuča, Đakovo, 14. 7. 2026.'] }
        phenomenon: { $ref: '#/components/schemas/Phenomenon' }
        region: { $ref: '#/components/schemas/RegionRef' }
        started_at: { type: string, format: date-time }
        last_report_at: { type: string, format: date-time }
        report_count: { type: integer, minimum: 0 }
        centroid: { $ref: '#/components/schemas/GeoPoint' }
        has_expert_comment: { type: boolean }
    EventPage:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EventSummary' }
        count: { type: integer }
    ExpertComment:
      type: object
      required: [text, author, updated_at]
      properties:
        text: { type: string, maxLength: 3000 }
        author: { $ref: '#/components/schemas/UserSummary' }
        updated_at: { type: string, format: date-time }
    ExpertCommentUpsert:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 3000 }
    EventDetail:
      allOf:
        - { $ref: '#/components/schemas/EventSummary' }
        - type: object
          required: [expert_comment, reports, photos]
          properties:
            expert_comment:
              oneOf:
                - { $ref: '#/components/schemas/ExpertComment' }
                - { type: 'null' }
            reports:
              type: array
              items: { $ref: '#/components/schemas/ReportSummary' }
            photos:
              type: array
              description: Fotografije svih vidljivih prijava događaja.
              items:
                allOf:
                  - { $ref: '#/components/schemas/Photo' }
                  - type: object
                    required: [report_id]
                    properties:
                      report_id: { type: integer }
    FrequencyStatistics:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            type: object
            required: [region, month, phenomenon, event_count]
            properties:
              region: { $ref: '#/components/schemas/RegionRef' }
              month: { type: string, pattern: '^\d{4}-\d{2}$', examples: ['2026-07'] }
              phenomenon: { $ref: '#/components/schemas/Phenomenon' }
              event_count: { type: integer, minimum: 0 }

    # ---------- lokacije i obavijesti
    FavoriteLocation:
      type: object
      required: [id, name, location, weather]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 60 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        weather: { $ref: '#/components/schemas/PlaceWeather' }
    FavoriteLocationCreate:
      type: object
      required: [name, location]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        location: { $ref: '#/components/schemas/GeoPoint' }
    FavoriteLocationUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
    NotificationRuleCreate:
      type: object
      description: |
        `type=warning` zahtijeva `min_warning_level` (`orange` ili `red`; „narančasta” uključuje i crvena upozorenja).
        `type=confirmed_report` zahtijeva `phenomenon` i `radius_km` (P-02).
      required: [type]
      properties:
        type: { type: string, enum: [warning, confirmed_report] }
        min_warning_level: { type: string, enum: [orange, red] }
        phenomenon: { $ref: '#/components/schemas/Phenomenon' }
        radius_km: { type: integer, minimum: 1, maximum: 50, default: 10 }
    NotificationRule:
      allOf:
        - type: object
          required: [id, location_id, created_at]
          properties:
            id: { type: integer }
            location_id: { type: integer }
            created_at: { type: string, format: date-time }
        - { $ref: '#/components/schemas/NotificationRuleCreate' }
    FollowCreate:
      type: object
      description: '`type=user` zahtijeva `username`; `type=location` zahtijeva `name`, `location` i `radius_km` (P-02).'
      required: [type]
      properties:
        type: { type: string, enum: [user, location] }
        username: { $ref: '#/components/schemas/Username' }
        name: { type: string, maxLength: 60 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        radius_km: { type: integer, minimum: 1, maximum: 50, default: 10 }
    Follow:
      type: object
      required: [id, type, created_at]
      properties:
        id: { type: integer }
        type: { type: string, enum: [user, location] }
        user:
          oneOf:
            - { $ref: '#/components/schemas/UserSummary' }
            - { type: 'null' }
        name: { type: [string, 'null'] }
        location:
          oneOf:
            - { $ref: '#/components/schemas/GeoPoint' }
            - { type: 'null' }
        radius_km: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }
    Notification:
      type: object
      required: [id, kind, title, body, link, created_at, read_at]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [warning, nearby_report, followed_user_report, followed_location_report, moderation_decision, sanction, content_removed]
        title: { type: string }
        body: { type: string }
        link:
          type: object
          description: Kamo vodi otvaranje obavijesti (UC-014).
          required: [type, id]
          properties:
            type: { type: string, enum: [report, event, warning] }
            id: { type: integer }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
    NotificationPage:
      type: object
      required: [items, count, unread_count, server_time]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        count: { type: integer }
        unread_count: { type: integer, minimum: 0 }
        server_time: { type: string, format: date-time }
    UnreadCount:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer, minimum: 0 }

    # ---------- moderacija
    ModerationDecision:
      type: object
      required: [decision]
      description: Za `reject` je `reason` obavezan i ima najmanje 10 znakova (PR-09).
      properties:
        decision: { type: string, enum: [confirm, reject] }
        reason: { type: string, minLength: 10, maxLength: 1000 }
    FlagQueueItem:
      type: object
      required: [id, target_type, target_id, report_id, region, excerpt, reasons, first_flagged_at, status]
      properties:
        id: { type: integer }
        target_type: { type: string, enum: [report, comment] }
        target_id: { type: integer }
        report_id: { type: integer }
        region: { $ref: '#/components/schemas/RegionRef' }
        excerpt: { type: string, description: Početak teksta prijave ili komentara. }
        reasons:
          type: array
          items:
            type: object
            required: [reason, count]
            properties:
              reason: { type: string, enum: [false_information, inappropriate, spam, other] }
              count: { type: integer, minimum: 1 }
        first_flagged_at: { type: string, format: date-time }
        status: { type: string, enum: [open, dismissed, removed] }
    FlagQueuePage:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FlagQueueItem' }
        count: { type: integer }
    FlagResolution:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [dismiss, remove_content] }
        note: { type: string, maxLength: 500 }
    SanctionCreate:
      type: object
      description: Za `posting_ban` je `days` obavezan (P-09).
      required: [type, reason, related_report_id]
      properties:
        type: { type: string, enum: [warning, posting_ban] }
        days: { type: integer, minimum: 1, maximum: 30 }
        reason: { type: string, minLength: 10, maxLength: 1000 }
        related_report_id: { type: integer, description: Prijava iz regije moderatora uz koju je sankcija vezana. }
    Sanction:
      type: object
      required: [id, type, reason, starts_at, ends_at, issued_by]
      properties:
        id: { type: integer }
        type: { type: string, enum: [warning, posting_ban] }
        reason: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        issued_by: { $ref: '#/components/schemas/Username' }

    # ---------- administracija
    AdminUser:
      type: object
      required: [id, username, email, roles, moderator_regions, reputation, is_active, date_joined, last_login]
      properties:
        id: { type: integer }
        username: { $ref: '#/components/schemas/Username' }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        moderator_regions:
          type: array
          items: { $ref: '#/components/schemas/RegionRef' }
        reputation: { type: integer }
        is_active: { type: boolean }
        date_joined: { type: string, format: date-time }
        last_login: { type: [string, 'null'], format: date-time }
    AdminUserPage:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        count: { type: integer }
    RolesUpdate:
      type: object
      description: Uz ulogu `moderator` popis `moderator_region_ids` ne smije biti prazan (F-027).
      required: [roles, moderator_region_ids]
      properties:
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [moderator, meteorologist] }
        moderator_region_ids:
          type: array
          uniqueItems: true
          items: { type: integer }
    SystemSettings:
      type: object
      description: Parametri P-01 – P-10 i adrese izvora DHMZ-a (NF-11).
      required:
        - max_favorite_locations
        - radius_km_min
        - radius_km_max
        - radius_km_default
        - max_photos_per_report
        - max_photo_size_mb
