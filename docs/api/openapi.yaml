openapi: 3.1.0
info:
  title: StormWatch API
  version: 0.1.0
  summary: Ugovor između React frontenda i Django Ninja backenda.
  description: |
    Ugovor između frontenda (React + TypeScript, `/frontend`) i backenda (Django + Django Ninja).
    Svaka operacija navodi zahtjeve i obrasce uporabe koje pokriva (`x-requirements`, `x-use-cases`),
    prema `docs/2-Analiza-zahtjeva.md` i `docs/3-Obrasci-uporabe.md`.

    ## Konvencije
    - Tijela zahtjeva i odgovora su JSON (`application/json`), osim predaje prijave i fotografije profila
      (`multipart/form-data`) te izvoza CSV-a (`text/csv`).
    - Nazivi polja su u `snake_case`, kao u Django Ninja shemama.
    - Vremena su ISO 8601 s vremenskom zonom (npr. `2026-07-14T16:20:00+02:00`).
    - Koordinate su WGS 84 (SRID 4326): točke kao `{lat, lon}`, a granice regija kao GeoJSON (redoslijed `[lon, lat]`).
    - Identifikatori su cijeli brojevi; korisnike javno adresiramo korisničkim imenom.
    - Mjerne jedinice prema DR-03: °C, %, hPa, m/s, smjer vjetra kao strana svijeta.

    ## Autentikacija (F-001, F-002, NF-04)
    - Prijava i registracija idu isključivo Google računom, preko django-allauth (headless, klijent `browser`).
    - Nakon prijave sustav izdaje vlastiti pristupni token: identifikator Django sesije u HttpOnly kolačiću `sessionid`.
      Odjava ga poništava; deaktivacija računa poništava sve sesije korisnika (F-030).
    - Zahtjevi koji mijenjaju podatke (POST, PUT, PATCH, DELETE) šalju i zaglavlje `X-CSRFToken`
      s vrijednošću kolačića `csrftoken` (dohvaća se pozivom `GET /api/v1/auth/csrf`).
    - Frontend sve pozive radi s `fetch(..., { credentials: 'include' })`.

    ## Greške
    - `401` nema valjane sesije; `403` nedovoljna ovlast ili regija (NF-05) ili aktivna zabrana objavljivanja (PR-09);
      `404` resurs ne postoji ili ga korisnik ne smije vidjeti (PR-07); `409` sukob stanja; `422` neispravni podaci.
    - Greške validacije vraćaju se po poljima (format Django Ninje), pa ih frontend prikazuje uz pripadajuće polje forme.

    ## Paginacija
    Popisi primaju `limit` i `offset` i vraćaju `{ items, count }` (Django Ninja `LimitOffsetPagination`).

    ## Prikaz bez osvježavanja (NF-02)
    Frontend periodično poziva popise s parametrom `updated_since` (vrijednost `server_time` iz prethodnog odgovora)
    i dobiva samo nove ili promijenjene zapise te `removed_ids` za zapise koji su u međuvremenu skriveni.
    Interval pollinga mora biti kraći od 20 s.

    ## Podaci DHMZ-a (NF-08)
    Odgovori s podacima DHMZ-a sadrže `source: DHMZ`; frontend uz njih uvijek prikazuje „Izvor: DHMZ”.

servers:
  - url: http://localhost:8000
    description: Lokalni razvoj (Docker Compose)
  - url: https://{host}
    description: Render web servis
    variables:
      host:
        default: stormwatch-api.onrender.com
        description: Primjer; stvarna adresa određuje se pri postavljanju na Render.

tags:
  - name: Autentikacija
    description: Prijava Google računom (django-allauth headless) i CSRF.
  - name: Podaci DHMZ-a
    description: Javni pregledi; postaje, mjerenja, prognoze, upozorenja i regije.
  - name: Prijave
    description: Predaja, pregled, glasanje, komentari i prijava neprimjerenog sadržaja.
  - name: Događaji i statistika
    description: Grupirane prijave, arhiva i izvoz CSV-a.
  - name: Profil
    description: Vlastiti i javni profil.
  - name: Lokacije i obavijesti
    description: Omiljene lokacije, pravila obavijesti, praćenje i obavijesti.
  - name: Moderacija
    description: Red moderacije, prijavljeni sadržaj, sankcije i pouzdani motritelji.
  - name: Stručni sadržaj
    description: Radnje meteorologa.
  - name: Administracija
    description: Korisnici, uloge, parametri sustava i statistika korištenja.

security:
  - sessionCookie: []

paths:
  # ---------------------------------------------------------------- Autentikacija
  /_allauth/browser/v1/auth/session:
    get:
      tags: [Autentikacija]
      operationId: getAuthSession
      summary: Stanje prijave
      description: |
        Endpoint django-allauth headless. Vraća `200` za prijavljenog korisnika, a `401` za neprijavljenog
        ili za korisnika koji je usred prve prijave (tok `provider_signup`, odabir korisničkog imena).
        Točan oblik odgovora određuje specifikacija django-allauth (`HEADLESS_SERVE_SPECIFICATION = True`).
      x-requirements: [F-002, F-003]
      x-use-cases: [UC-003]
      security: [{}]
      responses:
        '200':
          description: Korisnik je prijavljen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllauthResponse' }
        '401':
          description: Korisnik nije prijavljen ili mora dovršiti registraciju.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllauthResponse' }
    delete:
      tags: [Autentikacija]
      operationId: logout
      summary: Odjava
      description: Poništava sesiju. allauth nakon odjave vraća `401` s `meta.is_authenticated = false`.
      x-requirements: [F-002]
      x-use-cases: [UC-003]
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '401':
          description: Korisnik je odjavljen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllauthResponse' }

  /_allauth/browser/v1/auth/provider/redirect:
    post:
      tags: [Autentikacija]
      operationId: startGoogleLogin
      summary: Početak prijave Google računom
      description: |
        Šalje se kao obična HTML forma (navigacija cijele stranice), ne kao `fetch`.
        Preglednik se preusmjerava na Google, a nakon prijave natrag na `callback_url` u frontendu.
      x-requirements: [F-001, F-002]
      x-use-cases: [UC-003]
      security: [{}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [provider, callback_url, process, csrfmiddlewaretoken]
              properties:
                provider: { type: string, const: google }
                callback_url: { type: string, format: uri, examples: ['https://stormwatch.example/prijava/povratak'] }
                process: { type: string, const: login }
                csrfmiddlewaretoken: { type: string }
      responses:
        '302':
          description: Preusmjeravanje na Googleovu stranicu za prijavu.

  /_allauth/browser/v1/auth/provider/token:
    post:
      tags: [Autentikacija]
      operationId: loginWithGoogleIdToken
      summary: Prijava Googleovim ID tokenom
      description: |
        Alternativa preusmjeravanju (Google Identity Services u frontendu). Backend provjerava potpis,
        izdavatelja, primatelja i rok valjanosti ID tokena (NF-04).
      x-requirements: [F-001, F-002, NF-04]
      x-use-cases: [UC-003]
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, process, token]
              properties:
                provider: { type: string, const: google }
                process: { type: string, const: login }
                token:
                  type: object
                  required: [client_id, id_token]
                  properties:
                    client_id: { type: string }
                    id_token: { type: string }
      responses:
        '200':
          description: Korisnik je prijavljen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllauthResponse' }
        '400':
          description: ID token nije valjan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllauthResponse' }
        '401':
          description: Prva prijava; korisnik mora odabrati korisničko ime (`provider_signup`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllauthResponse' }

  /_allauth/browser/v1/auth/provider/signup:
    post:
      tags: [Autentikacija]
      operationId: completeGoogleSignup
      summary: Dovršetak registracije pri prvoj prijavi
      description: |
        Pri prvoj prijavi korisnik odabire jedinstveno korisničko ime i potvrđuje obavijest o privatnosti.
        Polje `privacy_notice_accepted` dodajemo vlastitom formom (`ACCOUNT_SIGNUP_FORM_CLASS`).
        Adresa e-pošte preuzima se iz Google računa.
      x-requirements: [F-001]
      x-use-cases: [UC-003]
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, privacy_notice_accepted]
              properties:
                username: { $ref: '#/components/schemas/Username' }
                privacy_notice_accepted: { type: boolean, const: true }
      responses:
        '200':
          description: Račun je stvoren i korisnik je prijavljen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllauthResponse' }
        '400':
          description: Korisničko ime je zauzeto ili neispravno.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllauthResponse' }

  /api/v1/auth/csrf:
    get:
      tags: [Autentikacija]
      operationId: getCsrfCookie
      summary: Postavljanje kolačića csrftoken
      description: Frontend ga poziva pri pokretanju; vrijednost kolačića šalje u zaglavlju `X-CSRFToken`.
      x-requirements: [NF-04]
      security: [{}]
      responses:
        '204':
          description: Kolačić `csrftoken` je postavljen.
          headers:
            Set-Cookie:
              schema: { type: string, examples: ['csrftoken=abc123; Path=/; SameSite=Lax; Secure'] }

  # ---------------------------------------------------------------- Podaci DHMZ-a
  /api/v1/data-status:
    get:
      tags: [Podaci DHMZ-a]
      operationId: getDataStatus
      summary: Vrijeme posljednjeg preuzimanja podataka DHMZ-a
      x-requirements: [F-026, NF-03]
      x-use-cases: [UC-001, UC-023]
      security: [{}]
      responses:
        '200':
          description: Stanje izvora.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataStatus' }

  /api/v1/regions:
    get:
      tags: [Podaci DHMZ-a]
      operationId: listRegions
      summary: Regije s najvišom razinom aktivnog upozorenja
      description: Sloj upozorenja na karti; granice se šalju samo uz `include_geometry=true`.
      x-requirements: [F-005, F-023, DR-02]
      x-use-cases: [UC-001]
      security: [{}]
      parameters:
        - name: include_geometry
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Popis regija.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Region' }

  /api/v1/stations:
    get:
      tags: [Podaci DHMZ-a]
      operationId: listStations
      summary: Mjerne postaje s posljednjim mjerenjem
      x-requirements: [F-005, F-026, NF-08, DR-03]
      x-use-cases: [UC-001]
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/Bbox'
      responses:
        '200':
          description: Postaje.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Station' }

  /api/v1/stations/{station_id}:
    get:
      tags: [Podaci DHMZ-a]
      operationId: getStation
      summary: Mjerna postaja
      x-requirements: [F-005]
      x-use-cases: [UC-001]
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/StationId'
      responses:
        '200':
          description: Postaja s posljednjim mjerenjem.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Station' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/stations/{station_id}/measurements:
    get:
      tags: [Podaci DHMZ-a]
      operationId: listStationMeasurements
      summary: Povijest mjerenja postaje
      x-requirements: [F-026]
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/StationId'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Mjerenja, najnovije prvo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementPage' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/warnings:
    get:
      tags: [Podaci DHMZ-a]
      operationId: listWarnings
      summary: Upozorenja DHMZ-a
      description: Zadano vraća samo upozorenja čije razdoblje važenja obuhvaća trenutačno vrijeme (F-007).
      x-requirements: [F-005, F-007, NF-08, DR-01, DR-02]
      x-use-cases: [UC-001, UC-002]
      security: [{}]
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - name: active
          in: query
          schema: { type: boolean, default: true }
        - name: min_level
          in: query
          schema: { $ref: '#/components/schemas/WarningLevel' }
      responses:
        '200':
          description: Upozorenja.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Warning' }

  /api/v1/weather:
    get:
      tags: [Podaci DHMZ-a]
      operationId: getPlaceWeather
      summary: Vrijeme za mjesto
      description: |
        Mjerenja najbliže postaje (PR-08), prognoza najbližeg mjesta za koje DHMZ objavljuje prognozu
        i aktivna upozorenja za regiju odabrane točke.
      x-requirements: [F-007, NF-08]
      x-use-cases: [UC-002]
      security: [{}]
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Vrijeme za mjesto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceWeather' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/places:
    get:
      tags: [Podaci DHMZ-a]
      operationId: searchPlaces
      summary: Pretraživanje naziva mjesta
      x-requirements: [F-008]
      x-use-cases: [UC-005]
      security: [{}]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 60 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Mjesta koja odgovaraju upitu.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Place' }

  # ---------------------------------------------------------------- Prijave
  /api/v1/reports:
    get:
      tags: [Prijave]
      operationId: listReports
      summary: Prijave za kartu i popise
      description: |
        Vraća samo prijave koje pozivatelj smije vidjeti (PR-07): posjetitelj samo potvrđene,
        registrirani korisnik i one na čekanju, a moderator regije i administrator sve.
        Uz `updated_since` vraća samo nove ili promijenjene prijave i `removed_ids` (NF-02).
      x-requirements: [F-003, F-005, F-006, F-011, F-025, NF-02]
      x-use-cases: [UC-001, UC-010]
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/PhenomenonFilter'
        - $ref: '#/components/parameters/ObservedFrom'
        - $ref: '#/components/parameters/ObservedTo'
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/RegionId'
        - name: event_id
          in: query
          schema: { type: integer }
        - name: valuable_only
          in: query
          description: Samo prijave koje je meteorolog označio kao vrijedne (F-025).
          schema: { type: boolean, default: false }
        - name: include_deleted
          in: query
          description: Samo za administratora; uključuje obrisane prijave (F-023, F-030).
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/UpdatedSince'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Prijave, najnovije opažanje prvo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Prijave]
      operationId: createReport
      summary: Predaja prijave opažanja
      description: |
        Sustav provjerava podatke (PR-01) i fotografije (NF-06, P-03), uklanja EXIF metapodatke (NF-07),
        pridružuje mjerenje najbliže postaje (PR-08) i događaj (PR-04). Odgovor stiže najkasnije 10 s
        nakon prijenosa fotografija (NF-01). Prijava je u stanju `pending`, a za pouzdanog motritelja
        odmah `confirmed` (F-022).
      x-requirements: [F-009, F-010, F-011, F-016, F-022, NF-01, NF-06, NF-07, PR-01, PR-09]
      x-use-cases: [UC-006]
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ReportCreate' }
            encoding:
              photos:
                contentType: image/jpeg, image/png, image/webp, image/heic
      responses:
        '201':
          description: Prijava je zaprimljena.
          headers:
            Location:
              schema: { type: string, examples: ['/api/v1/reports/1042'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Korisnik ima aktivnu zabranu objavljivanja (PR-09).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: Fotografija je veća od dopuštenog (P-03).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/reports/{report_id}:
    get:
      tags: [Prijave]
      operationId: getReport
      summary: Detalj prijave
      description: |
        Uključuje fotografije, mjerenje najbliže postaje u trenutku opažanja (F-010), broj potvrda i osporavanja,
        ocjenu vjerodostojnosti i glas pozivatelja. Obrazloženje odbijanja vide samo autor, moderator regije i administrator.
      x-requirements: [F-010, F-011, F-012, F-013, F-022, F-025, PR-07]
      x-use-cases: [UC-007]
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Prijava.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Moderacija]
      operationId: deleteReport
      summary: Brisanje prijave
      description: |
        Dopušteno moderatoru regije prijave (F-023) i administratoru (F-030). Brisanje je logičko:
        obrisanu prijavu vidi samo administrator. Autor dobiva obavijest.
      x-requirements: [F-023, F-030, NF-05]
      x-use-cases: [UC-016, UC-020]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '204':
          description: Prijava je obrisana.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/reports/{report_id}/vote:
    put:
      tags: [Prijave]
      operationId: castVote
      summary: Potvrda ili osporavanje prijave
      description: |
        Postavlja ili mijenja glas pozivatelja (PR-02). Sustav ponovno izračunava ocjenu vjerodostojnosti (PR-03)
        i reputaciju autora (PR-05).
      x-requirements: [F-012, F-013, F-021, PR-02, PR-03, PR-05]
      x-use-cases: [UC-007]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoteRequest' }
      responses:
        '200':
          description: Glas je zabilježen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Korisnik ne može glasati za vlastitu prijavu (PR-02a).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Za prijavu u ovom stanju ne može se glasati (PR-02d).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Prijave]
      operationId: withdrawVote
      summary: Povlačenje glasa
      x-requirements: [F-012, F-013, F-021, PR-02, PR-05]
      x-use-cases: [UC-007]
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Glas je povučen.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/reports/{report_id}/comments:
    get:
      tags: [Prijave]
      operationId: listReportComments
      summary: Komentari prijave
      x-requirements: [F-014, NF-02]
      x-use-cases: [UC-008]
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/UpdatedSince'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Komentari, najstariji prvo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommentPage' }
