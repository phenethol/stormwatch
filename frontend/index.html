<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
    <meta name="theme-color" content="#172b46" />
    <meta name="description" content="StormWatch – interaktivna karta meteoroloških pojava, prijava građana te mjerenja i upozorenja DHMZ-a." />
    <title>StormWatch</title>
    <link rel="icon" type="image/svg+xml" href="/storm.svg" />
  </head>
  <body>
    <div id="root"></div>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <filter id="dark-terrain" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0 0.486 -0.177 0 -0.049  0 0.543 -0.2025 0 0.006  0 0.268 0.038 0 0.078  0 0 0 1 0" />
      </filter>
    </svg>
    <script>
      const root = document.getElementById('root')

      function showStartupError(...details) {
        if (root.childElementCount) return
        console.error('StormWatch startup', ...details)
        root.textContent = 'StormWatch se nije mogao učitati. Osvježite stranicu i pokušajte ponovno.'
      }

      window.addEventListener('error', event => {
        showStartupError(event.message || event.target?.src, event.error)
      }, true)

      window.addEventListener('unhandledrejection', event => {
        showStartupError(event.reason)
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
