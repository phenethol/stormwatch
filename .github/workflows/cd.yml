name: CD Pipeline

# Deploy only after the CI Pipeline has passed for a push to main.
on:
  workflow_run:
    workflows: [ "CI Pipeline" ]
    types: [ completed ]
    branches: [ main ]

# Jobs only call Render deploy hooks, so they need no GITHUB_TOKEN permissions.
permissions: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  frontend:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (frontend)
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -fsS -X POST "$HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set. Skipping."
          fi

  backend:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook (backend)
        env:
          HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -fsS -X POST "$HOOK_URL"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK_URL not set. Skipping."
          fi
